[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shape-of-failure"
version = "0.1.0"
description = "An executable argument for treating AI failure as a systems property."
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "hypothesis>=6.161,<7",
  "mutmut>=3.5,<4",
  "pytest>=9,<10",
]

[project.scripts]
shape-of-failure = "shape_of_failure.experiment:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/shape_of_failure/contract.py"]
pytest_add_cli_args_test_selection = ["tests/"]
